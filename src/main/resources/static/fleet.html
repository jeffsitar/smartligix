<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLogix – Fleet &amp; Driver Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="slx-backdrop" id="slxBackdrop"></div>
<div class="slx-shell">
    <aside class="slx-sidebar" id="slxSidebar"></aside>
    <div class="slx-main">
        <header class="slx-topbar" id="slxTopbar"></header>
        <main class="slx-content">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="slx-card p-4 mb-4" id="vehicleFormCard">
                        <h6 class="fw-bold mb-3"><i class="bi bi-truck me-1 text-warning"></i>Register Fleet Vehicle</h6>
                        <form id="vehicleForm" class="row g-2">
                            <div class="col-md-6">
                                <input type="text" id="regNo" class="form-control form-control-sm font-mono" placeholder="Reg No (MH-01-AB-1234)" required>
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="vType" class="form-control form-control-sm" placeholder="Type (e.g., Reefer Van)" required>
                            </div>
                            <div class="col-md-4">
                                <input type="text" id="vCap" class="form-control form-control-sm" placeholder="Capacity (2,500 kg)" required>
                            </div>
                            <div class="col-md-4">
                                <input type="text" id="vHub" class="form-control form-control-sm" placeholder="Home Hub" value="Mumbai Central Hub">
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-orange btn-sm w-100"><i class="bi bi-plus-lg me-1"></i>Add Vehicle</button>
                            </div>
                        </form>
                    </div>

                    <div class="slx-card overflow-hidden">
                        <div class="p-3 border-bottom fw-bold small text-uppercase text-muted">Registered Fleet Vehicles</div>
                        <div class="table-responsive">
                            <table class="table slx-table">
                                <thead>
                                    <tr><th>Registration</th><th>Type &amp; Capacity</th><th>Hub</th><th>Status</th></tr>
                                </thead>
                                <tbody id="vehiclesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="slx-card p-4 mb-4" id="driverFormCard">
                        <h6 class="fw-bold mb-3"><i class="bi bi-person-badge me-1 text-primary"></i>Register Driver</h6>
                        <form id="driverForm" class="row g-2">
                            <div class="col-md-6">
                                <input type="text" id="dName" class="form-control form-control-sm" placeholder="Driver Full Name" required>
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="dPhone" class="form-control form-control-sm" placeholder="Phone (+91 ...)" required>
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="dLic" class="form-control form-control-sm font-mono" placeholder="Licence Reference" required>
                            </div>
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-navy btn-sm w-100"><i class="bi bi-plus-lg me-1"></i>Add Driver</button>
                            </div>
                        </form>
                    </div>

                    <div class="slx-card overflow-hidden">
                        <div class="p-3 border-bottom fw-bold small text-uppercase text-muted">Active Driver Roster</div>
                        <div class="table-responsive">
                            <table class="table slx-table">
                                <thead>
                                    <tr><th>Driver</th><th>Licence</th><th>Rating</th><th>Status</th></tr>
                                </thead>
                                <tbody id="driversBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
let currentUser = null;

(async function () {
    currentUser = await window.SLX.initAppShell("Fleet & Drivers");
    if (!currentUser) return;
    if (!["ADMIN", "DISPATCHER"].includes(currentUser.role)) {
        document.getElementById("vehicleFormCard").classList.add("d-none");
        document.getElementById("driverFormCard").classList.add("d-none");
    }
    await loadFleet();
})();

async function loadFleet() {
    try {
        const [vehicles, drivers] = await Promise.all([
            window.SLX.apiFetch("/api/fleet/vehicles"),
            window.SLX.apiFetch("/api/fleet/drivers")
        ]);
        const canEdit = ["ADMIN", "DISPATCHER"].includes(currentUser.role);

        document.getElementById("vehiclesBody").innerHTML = vehicles.map((v) => `
            <tr>
                <td class="fw-bold font-mono">${window.SLX.escapeHtml(v.registrationNumber)}</td>
                <td>
                    <div>${window.SLX.escapeHtml(v.vehicleType)}</div>
                    <div class="text-muted small">${window.SLX.escapeHtml(v.capacity)} &bull; ${window.SLX.escapeHtml(v.fuelType || "Diesel")}</div>
                </td>
                <td class="small text-muted">${window.SLX.escapeHtml(v.currentHub || "")}</td>
                <td>
                    ${canEdit ? `
                        <select class="form-select form-select-sm" style="width:130px;" onchange="updateVehicleStatus(${v.vehicleId}, this.value)">
                            <option value="AVAILABLE" ${v.availabilityStatus === "AVAILABLE" ? "selected" : ""}>AVAILABLE</option>
                            <option value="ON_TRIP" ${v.availabilityStatus === "ON_TRIP" ? "selected" : ""}>ON_TRIP</option>
                            <option value="MAINTENANCE" ${v.availabilityStatus === "MAINTENANCE" ? "selected" : ""}>MAINTENANCE</option>
                        </select>` : window.SLX.getStatusBadge(v.availabilityStatus)}
                </td>
            </tr>
        `).join("");

        document.getElementById("driversBody").innerHTML = drivers.map((d) => `
            <tr>
                <td>
                    <div class="fw-semibold">${window.SLX.escapeHtml(d.driverName)}</div>
                    <div class="text-muted small">${window.SLX.escapeHtml(d.phone)}</div>
                </td>
                <td class="font-mono small">${window.SLX.escapeHtml(d.licenceReference)}</td>
                <td class="small"><i class="bi bi-star-fill text-warning me-1"></i>${Number(d.rating || 4.8).toFixed(1)}</td>
                <td>
                    ${canEdit ? `
                        <select class="form-select form-select-sm" style="width:130px;" onchange="updateDriverStatus(${d.driverId}, this.value)">
                            <option value="AVAILABLE" ${d.availabilityStatus === "AVAILABLE" ? "selected" : ""}>AVAILABLE</option>
                            <option value="ON_TRIP" ${d.availabilityStatus === "ON_TRIP" ? "selected" : ""}>ON_TRIP</option>
                            <option value="MAINTENANCE" ${d.availabilityStatus === "MAINTENANCE" ? "selected" : ""}>OFF DUTY</option>
                        </select>` : window.SLX.getStatusBadge(d.availabilityStatus)}
                </td>
            </tr>
        `).join("");
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
}

async function updateVehicleStatus(id, status) {
    try {
        const res = await window.SLX.apiFetch(`/api/fleet/vehicles/${id}/status`, {
            method: "PATCH",
            body: JSON.stringify({ availabilityStatus: status })
        });
        window.SLX.showToast(res.message, "success");
    } catch (err) {
        window.SLX.showToast(err.message, "error");
        loadFleet();
    }
}

async function updateDriverStatus(id, status) {
    try {
        const res = await window.SLX.apiFetch(`/api/fleet/drivers/${id}/status`, {
            method: "PATCH",
            body: JSON.stringify({ availabilityStatus: status })
        });
        window.SLX.showToast(res.message, "success");
    } catch (err) {
        window.SLX.showToast(err.message, "error");
        loadFleet();
    }
}

document.getElementById("vehicleForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await window.SLX.apiFetch("/api/fleet/vehicles", {
            method: "POST",
            body: JSON.stringify({
                registrationNumber: document.getElementById("regNo").value,
                vehicleType: document.getElementById("vType").value,
                capacity: document.getElementById("vCap").value,
                currentHub: document.getElementById("vHub").value
            })
        });
        window.SLX.showToast("Vehicle registered successfully.", "success");
        e.target.reset();
        loadFleet();
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
});

document.getElementById("driverForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await window.SLX.apiFetch("/api/fleet/drivers", {
            method: "POST",
            body: JSON.stringify({
                driverName: document.getElementById("dName").value,
                phone: document.getElementById("dPhone").value,
                licenceReference: document.getElementById("dLic").value
            })
        });
        window.SLX.showToast("Driver registered successfully.", "success");
        e.target.reset();
        loadFleet();
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
});
</script>
</body>
</html>
