<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLogix – Settings &amp; User Administration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="slx-backdrop" id="slxBackdrop"></div>
<div class="slx-shell">
    <aside class="slx-sidebar" id="slxSidebar"></aside>
    <div class="slx-main">
        <header class="slx-topbar" id="slxTopbar"></header>
        <main class="slx-content">
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="slx-card p-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-sliders me-1 text-warning"></i>Company Profile &amp; Freight Pricing Rules</h6>
                        <form id="settingsForm">
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Company Legal Name</label>
                                <input type="text" id="company_name" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Company GSTIN</label>
                                <input type="text" id="company_gstin" class="form-control form-control-sm font-mono">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Headquarters Address</label>
                                <input type="text" id="company_address" class="form-control form-control-sm">
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Base Rate (INR)</label>
                                    <input type="number" id="base_rate" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Rate per kg (INR)</label>
                                    <input type="number" id="per_kg_rate" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label small fw-semibold">Fuel %</label>
                                    <input type="number" id="fuel_surcharge_pct" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label small fw-semibold">GST %</label>
                                    <input type="number" id="gst_pct" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-4">
                                    <label class="form-label small fw-semibold">Terms (days)</label>
                                    <input type="number" id="payment_terms_days" class="form-control form-control-sm" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-orange w-100 btn-sm py-2">Save Operational Settings</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="slx-card p-4 mb-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-person-plus me-1 text-primary"></i>Create Staff / Operator Account</h6>
                        <form id="userForm" class="row g-2">
                            <div class="col-md-4"><input type="text" id="uName" class="form-control form-control-sm" placeholder="Full Name" required></div>
                            <div class="col-md-4"><input type="email" id="uEmail" class="form-control form-control-sm" placeholder="Email" required></div>
                            <div class="col-md-4">
                                <select id="uRole" class="form-select form-select-sm">
                                    <option value="DISPATCHER">DISPATCHER</option>
                                    <option value="WAREHOUSE">WAREHOUSE</option>
                                    <option value="DRIVER">DRIVER</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="CUSTOMER">CUSTOMER</option>
                                </select>
                            </div>
                            <div class="col-md-4"><input type="text" id="uPhone" class="form-control form-control-sm" placeholder="Phone"></div>
                            <div class="col-md-4"><input type="password" id="uPass" class="form-control form-control-sm" placeholder="Password (min 6)" minlength="6" required></div>
                            <div class="col-md-4"><button type="submit" class="btn btn-navy btn-sm w-100">Add User</button></div>
                        </form>
                    </div>

                    <div class="slx-card overflow-hidden">
                        <div class="p-3 border-bottom fw-bold small text-uppercase text-muted">Role-Based Access Directory</div>
                        <div class="table-responsive">
                            <table class="table slx-table">
                                <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
                                <tbody id="usersBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
(async function () {
    const user = await window.SLX.initAppShell("Settings & Users");
    if (!user) return;
    if (user.role !== "ADMIN") {
        window.SLX.showToast("Admin access required.", "error");
        window.location.href = "dashboard.html";
        return;
    }
    await loadSettings();
    await loadUsers();
})();

async function loadSettings() {
    const s = await window.SLX.apiFetch("/api/settings");
    ["company_name", "company_gstin", "company_address", "base_rate", "per_kg_rate", "fuel_surcharge_pct", "gst_pct", "payment_terms_days"].forEach((k) => {
        if (document.getElementById(k) && s[k] !== undefined) document.getElementById(k).value = s[k];
    });
}

document.getElementById("settingsForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {};
    ["company_name", "company_gstin", "company_address", "base_rate", "per_kg_rate", "fuel_surcharge_pct", "gst_pct", "payment_terms_days"].forEach((k) => {
        payload[k] = document.getElementById(k).value;
    });
    try {
        const res = await window.SLX.apiFetch("/api/settings", { method: "PUT", body: JSON.stringify(payload) });
        window.SLX.showToast(res.message, "success");
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
});

async function loadUsers() {
    const users = await window.SLX.apiFetch("/api/settings/users");
    document.getElementById("usersBody").innerHTML = users.map((u) => `
        <tr>
            <td>
                <div class="fw-semibold">${window.SLX.escapeHtml(u.fullName)}</div>
                <div class="text-muted small">${window.SLX.escapeHtml(u.email)}</div>
            </td>
            <td><span class="badge bg-dark">${window.SLX.escapeHtml(u.role)}</span></td>
            <td>${window.SLX.getStatusBadge(u.active ? "ACTIVE" : "CANCELLED")}</td>
            <td>
                <button class="btn btn-light border btn-sm" onclick="toggleUser(${u.userId})">${u.active ? "Deactivate" : "Activate"}</button>
            </td>
        </tr>
    `).join("");
}

document.getElementById("userForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await window.SLX.apiFetch("/api/settings/users", {
            method: "POST",
            body: JSON.stringify({
                fullName: document.getElementById("uName").value,
                email: document.getElementById("uEmail").value,
                role: document.getElementById("uRole").value,
                phone: document.getElementById("uPhone").value,
                password: document.getElementById("uPass").value
            })
        });
        e.target.reset();
        window.SLX.showToast("User account created.", "success");
        loadUsers();
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
});

async function toggleUser(id) {
    try {
        const res = await window.SLX.apiFetch(`/api/settings/users/${id}/toggle`, { method: "PATCH" });
        window.SLX.showToast(res.message, "info");
        loadUsers();
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
}
</script>
</body>
</html>
