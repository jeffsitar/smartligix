<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLogix – Live Tracking &amp; Proof of Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="slx-backdrop" id="slxBackdrop"></div>
<div class="slx-shell">
    <aside class="slx-sidebar" id="slxSidebar"></aside>
    <div class="slx-main">
        <header class="slx-topbar" id="slxTopbar"></header>
        <main class="slx-content">
            <div class="slx-card p-3 mb-4">
                <form id="trackSearchForm" class="row g-2 align-items-center">
                    <div class="col-md-7">
                        <input type="text" id="trackingInput" class="form-control font-mono" value="TRK-2026-88912" placeholder="Enter Tracking Number (e.g. TRK-2026-88912)">
                    </div>
                    <div class="col-md-3">
                        <select id="recentShipmentSelect" class="form-select small">
                            <option value="">Or select active shipment...</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-navy w-100"><i class="bi bi-search me-1"></i>Track</button>
                    </div>
                </form>
            </div>

            <div id="trackError" class="alert alert-danger d-none"></div>

            <div id="shipmentDetails" class="d-none">
                <div class="slx-card p-4 mb-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <h4 id="dispTracking" class="fw-bold font-mono mb-0"></h4>
                                <span id="dispBadge"></span>
                            </div>
                            <div id="dispRoute" class="text-muted small mt-1"></div>
                        </div>
                        <div class="text-md-end small">
                            <div><strong>Est. Delivery:</strong> <span id="dispEta" class="font-mono"></span></div>
                            <div class="text-muted" id="dispFleet"></div>
                        </div>
                    </div>

                    <div class="milestone-stepper" id="milestoneStepper"></div>
                    <div id="trackingMap" class="mt-3"></div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="slx-card p-4 h-100">
                            <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-1 text-primary"></i>Chronological Checkpoint Timeline</h6>
                            <div id="timelineContainer"></div>

                            <div id="podDisplayCard" class="d-none mt-4 p-3 rounded-3 border border-success bg-success bg-opacity-10">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold text-success small"><i class="bi bi-patch-check-fill me-1"></i>PROOF OF DELIVERY VERIFIED</span>
                                    <span class="font-mono badge bg-success" id="podCodeBadge"></span>
                                </div>
                                <div class="small" id="podDetailsText"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5" id="statusUpdateCol">
                        <div class="slx-card p-4">
                            <h6 class="fw-bold mb-3"><i class="bi bi-send-check me-1 text-warning"></i>Append Milestone / POD Update</h6>
                            <input type="hidden" id="activeShipmentId">
                            <form id="statusUpdateForm">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Next Lifecycle Stage *</label>
                                    <select id="newStatus" class="form-select">
                                        <option value="PICKED_UP">PICKED_UP</option>
                                        <option value="IN_TRANSIT">IN_TRANSIT</option>
                                        <option value="OUT_FOR_DELIVERY">OUT_FOR_DELIVERY</option>
                                        <option value="DELIVERED">DELIVERED (Requires POD)</option>
                                        <option value="CANCELLED">CANCELLED</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Location / Hub Checkpoint *</label>
                                    <input type="text" id="locationNote" class="form-control" placeholder="e.g., Pune Hinjewadi Sorting Hub" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Operational Remarks</label>
                                    <input type="text" id="remarks" class="form-control" placeholder="Optional dispatch or customs note">
                                </div>

                                <div id="podInputsWrap" class="d-none p-3 rounded-3 bg-light border mb-3">
                                    <div class="fw-semibold small text-success mb-2"><i class="bi bi-pen me-1"></i>Proof of Delivery Details</div>
                                    <div class="mb-2">
                                        <label class="form-label small fw-semibold">Receiver Full Name *</label>
                                        <input type="text" id="podReceiverName" class="form-control form-control-sm" placeholder="Name of person receiving cargo">
                                    </div>
                                    <div>
                                        <label class="form-label small fw-semibold">Delivery Condition Notes</label>
                                        <input type="text" id="podNotes" class="form-control form-control-sm" placeholder="e.g., Seal intact, 4 cartons verified">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success w-100 fw-semibold">UPDATE STATUS LOG</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
let mapInst = null;
let mapLayerGroup = null;
let currentUser = null;

(async function () {
    currentUser = await window.SLX.initAppShell("Live Tracking & POD");
    if (!currentUser) return;

    if (currentUser.role === "CUSTOMER") {
        document.getElementById("statusUpdateCol").classList.add("d-none");
    }

    // Populate quick dropdown of user's visible shipments
    try {
        const list = await window.SLX.apiFetch("/api/shipments");
        const sel = document.getElementById("recentShipmentSelect");
        list.forEach((s) => {
            const opt = document.createElement("option");
            opt.value = s.trackingNumber;
            opt.textContent = `${s.trackingNumber} (${s.currentStatus})`;
            sel.appendChild(opt);
        });
        sel.addEventListener("change", () => {
            if (sel.value) {
                document.getElementById("trackingInput").value = sel.value;
                searchShipment();
            }
        });
    } catch (_) {}

    const params = new URLSearchParams(window.location.search);
    if (params.get("trk")) {
        document.getElementById("trackingInput").value = params.get("trk");
    }

    document.getElementById("newStatus").addEventListener("change", (e) => {
        const isDel = e.target.value === "DELIVERED";
        document.getElementById("podInputsWrap").classList.toggle("d-none", !isDel);
        document.getElementById("podReceiverName").required = isDel;
    });

    document.getElementById("trackSearchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        searchShipment();
    });

    await searchShipment();
})();

async function searchShipment() {
    const trk = document.getElementById("trackingInput").value.trim();
    if (!trk) return;
    const errBox = document.getElementById("trackError");
    const panel = document.getElementById("shipmentDetails");
    errBox.classList.add("d-none");

    try {
        const data = await window.SLX.apiFetch(`/api/shipments/${encodeURIComponent(trk)}`);
        panel.classList.remove("d-none");
        document.getElementById("activeShipmentId").value = data.shipmentId;
        document.getElementById("dispTracking").textContent = `${data.trackingNumber}`;
        document.getElementById("dispBadge").innerHTML = window.SLX.getStatusBadge(data.currentStatus);
        document.getElementById("dispRoute").textContent = `${data.customerName} (${data.bookingReference}) • ${data.pickupAddress} → ${data.deliveryAddress}`;
        document.getElementById("dispEta").textContent = data.estimatedDeliveryDate;
        document.getElementById("dispFleet").textContent = data.vehicle
            ? `Vehicle: ${data.vehicle.registrationNumber} | Driver: ${data.driver ? data.driver.driverName : "Assigned"}`
            : "Fleet assignment pending";

        renderStepper(data.currentStatus);
        renderMap(data);

        document.getElementById("timelineContainer").innerHTML = data.timeline.map((t) => `
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="fw-bold small">${window.SLX.escapeHtml(t.status.replace(/_/g, " "))} <span class="text-muted fw-normal">&bull; ${window.SLX.escapeHtml(t.updatedAt)}</span></div>
                <div class="small text-dark">${window.SLX.escapeHtml(t.locationNote)}</div>
                <div class="small text-muted">${window.SLX.escapeHtml(t.remarks || "")}</div>
            </div>
        `).join("");

        const podCard = document.getElementById("podDisplayCard");
        if (data.pod) {
            podCard.classList.remove("d-none");
            document.getElementById("podCodeBadge").textContent = data.pod.signatureCode;
            document.getElementById("podDetailsText").textContent = `Signed by ${data.pod.receiverName} on ${data.pod.timestamp}. ${data.pod.notes || ""}`;
        } else {
            podCard.classList.add("d-none");
        }
    } catch (err) {
        panel.classList.add("d-none");
        errBox.textContent = err.message;
        errBox.classList.remove("d-none");
    }
}

function renderStepper(status) {
    const stages = [
        { key: "BOOKED", label: "Booked", icon: "bi-receipt" },
        { key: "PICKED_UP", label: "Picked Up", icon: "bi-box-arrow-up" },
        { key: "IN_TRANSIT", label: "In Transit", icon: "bi-truck" },
        { key: "OUT_FOR_DELIVERY", label: "Out for Delivery", icon: "bi-geo-alt" },
        { key: "DELIVERED", label: "Delivered", icon: "bi-check-lg" }
    ];
    const idx = stages.findIndex((s) => s.key === status);
    document.getElementById("milestoneStepper").innerHTML = stages.map((st, i) => {
        let cls = "";
        if (status !== "CANCELLED") {
            if (i < idx || (i === idx && status === "DELIVERED")) cls = "done";
            else if (i === idx) cls = "current";
        }
        return `
            <div class="milestone-step ${cls}">
                <div class="milestone-dot"><i class="bi ${st.icon}"></i></div>
                <div class="milestone-label">${st.label}</div>
            </div>`;
    }).join("");
}

function renderMap(data) {
    if (!mapInst) {
        mapInst = L.map("trackingMap");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(mapInst);
        mapLayerGroup = L.layerGroup().addTo(mapInst);
    }
    mapLayerGroup.clearLayers();
    const o = data.coordinates.origin;
    const c = data.coordinates.current;
    const d = data.coordinates.destination;

    const pts = [
        [o.lat, o.lng],
        [c.lat, c.lng],
        [d.lat, d.lng]
    ];

    L.marker([o.lat, o.lng]).bindPopup(`<strong>Origin</strong><br>${window.SLX.escapeHtml(data.pickupAddress)}`).addTo(mapLayerGroup);
    L.marker([d.lat, d.lng]).bindPopup(`<strong>Destination</strong><br>${window.SLX.escapeHtml(data.deliveryAddress)}`).addTo(mapLayerGroup);
    L.circleMarker([c.lat, c.lng], { radius: 9, color: "#EA7B1A", fillColor: "#EA7B1A", fillOpacity: 0.9 })
        .bindPopup(`<strong>Current Checkpoint</strong><br>${window.SLX.escapeHtml(data.currentLocation)}`)
        .addTo(mapLayerGroup);

    L.polyline([[o.lat, o.lng], [c.lat, c.lng]], { color: "#0F9D68", weight: 4 }).addTo(mapLayerGroup);
    L.polyline([[c.lat, c.lng], [d.lat, d.lng]], { color: "#94A3B8", weight: 3, dashArray: "6, 8" }).addTo(mapLayerGroup);

    setTimeout(() => {
        mapInst.invalidateSize();
        mapInst.fitBounds(pts, { padding: [36, 36] });
    }, 100);
}

document.getElementById("statusUpdateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("activeShipmentId").value;
    try {
        const res = await window.SLX.apiFetch(`/api/shipments/${id}/status`, {
            method: "POST",
            body: JSON.stringify({
                status: document.getElementById("newStatus").value,
                locationNote: document.getElementById("locationNote").value,
                remarks: document.getElementById("remarks").value,
                podReceiverName: document.getElementById("podReceiverName").value,
                podNotes: document.getElementById("podNotes").value
            })
        });
        window.SLX.showToast(res.message, "success");
        e.target.reset();
        document.getElementById("podInputsWrap").classList.add("d-none");
        await searchShipment();
    } catch (err) {
        window.SLX.showToast(err.message, "error");
    }
});
</script>
</body>
</html>
